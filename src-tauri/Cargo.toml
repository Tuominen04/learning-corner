[package]
name = "personal-learning-corner"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-first learning, with every claim anchored to a source you chose."
rust-version = "1.82"

[lib]
name = "plc_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

# Pinned to an immutable revision of the engine repository.
#
# ADR 0006 calls for a git *tag*, and this becomes `tag = "v0.1.0"` the moment the engine's
# M0 pull request merges and that tag exists on its main branch. A revision is the same
# immutability with worse legibility, which is the documented interim rather than a silent
# deviation.
plc-engine = { git = "https://github.com/Tuominen04/personal-learning-corner-engine", rev = "fdc999d62f6ae21538944ae6deb7b975f09d42c0" }
