[package]
name = "learning-corner"
version = "0.19.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-first learning, with every claim anchored to a source you chose."
rust-version = "1.90"

[lib]
name = "lc_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.23"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ts-rs = "12"

# Pinned to an immutable tag on the engine's main branch, per ADR 0006. Tags are never moved,
# deleted, or reused, so this resolves to the same code forever; a version bump is a one-line
# diff naming the old tag and the new one.
lc-engine = { 
    git = "https://github.com/Tuominen04/learning-corner-engine", 
    tag = "v0.19.0" 
}

[dev-dependencies]
tempfile = "3"
