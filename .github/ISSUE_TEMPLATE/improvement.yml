name: Improvement
description: Something that already exists could work better — clearer, faster, easier.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For something the app does not do at all yet, start an
        [idea discussion](https://github.com/Tuominen04/learning-corner/discussions/new?category=ideas) instead.
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What would be better
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this myself
