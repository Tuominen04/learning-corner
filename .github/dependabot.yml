# Weekly dependency updates.
#
# Monday morning, so a week's worth is waiting at the start of the week rather than trickling
# in and interrupting.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # typescript-eslint accepts >=4.8.4 <6.1.0, so TypeScript 6 is fine and is what we are
      # on. 7 is not: no typescript-eslint release supports it, and taking it would mean
      # linting TypeScript with nothing that understands it. Only that jump is held — this
      # bound is deliberately >=7 rather than a pin, so 6.x updates still arrive.
      #
      # Remove this the moment typescript-eslint declares support for 7.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # One pull request for the routine bumps, and a second for the build tooling, which
      # breaks differently from what ships and is worth reading separately.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "typescript"
          - "eslint*"
          - "typescript-eslint"
      tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "typescript"
          - "eslint*"
          - "typescript-eslint"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # The engine is pinned to an immutable tag and bumped deliberately when a release is
      # cut (ADR 0006). An automatic bump here would defeat the point of pinning it.
      - dependency-name: "lc-engine"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types:
          - minor
          - patch
