name: Release

# Pushing a version tag builds the Linux packages and opens a draft release with them. Nothing
# is published until the maintainer reads the draft and presses Publish.
#
# Only the maintainer can push a `v*` tag — a tag ruleset enforces that — so this workflow never
# runs on anyone else's say-so.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release is cut from main and names the version it ships. Either mismatch is a
      # mistake caught here, before anything is built.
      - name: Tag is on main and matches the version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main"; exit 1; }
          for file in package.json src-tauri/tauri.conf.json; do
            found=$(node -p "require('./$file').version")
            [ "$found" = "$version" ] \
              || { echo "::error::$file says $found, the tag says $version"; exit 1; }
          done
          found=$(sed -nE 's/^version = "(.*)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$found" = "$version" ] \
            || { echo "::error::src-tauri/Cargo.toml says $found, the tag says $version"; exit 1; }

      - name: Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - run: npm ci

      # The lock is committed; a release builds exactly what CI tested.
      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --ci -- --locked

      # Tauri names the files after the product, space included. Rename them to what the
      # user guide tells people to look for.
      - name: Collect and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/release/bundle
          mkdir dist-release
          cp "$bundle"/rpm/*.rpm           "dist-release/learning-corner-$version.x86_64.rpm"
          cp "$bundle"/deb/*.deb           "dist-release/learning-corner_${version}_amd64.deb"
          cp "$bundle"/appimage/*.AppImage "dist-release/learning-corner-$version-x86_64.AppImage"
          cd dist-release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.rpm
            dist-release/*.deb
            dist-release/*.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist-release/
          if-no-files-found: error

  # Separate from the build, so the only job that can write to the repository runs no
  # dependency code at all.
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist-release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Learning Corner ${GITHUB_REF_NAME#v}" \
            --generate-notes
