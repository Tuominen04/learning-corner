name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Documentation conventions
        run: bash docs/check-docs.sh

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The engine is a private repository. actions/checkout's token covers only the
      # repository it checked out, so cargo has nothing to authenticate a fetch of the
      # engine with. CARGO_NET_GIT_FETCH_WITH_CLI matters as much as the token: without
      # it cargo uses its own git implementation, which ignores the rewrite below.
      - name: Authenticate cargo for the private engine repository
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${ENGINE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Regenerating the bindings is a test, so this also refreshes src/lib/bindings/.
      - name: Tests and binding generation
        working-directory: src-tauri
        run: cargo test

      # A stale committed copy means the interface is typed against a contract that no longer
      # exists. Catching it here is the whole point of generating rather than hand-writing.
      - name: Bindings are current
        run: git diff --exit-code -- src/lib/bindings

      # ADR 0006: the engine is pinned immutably. A path dependency builds on the author's
      # machine and nowhere else.
      - name: Engine is pinned, not a path dependency
        run: |
          if grep -qE '^\s*plc-engine\s*=.*\bpath\s*=' src-tauri/Cargo.toml; then
            echo "::error::src-tauri/Cargo.toml carries a path dependency on the engine"
            exit 1
          fi