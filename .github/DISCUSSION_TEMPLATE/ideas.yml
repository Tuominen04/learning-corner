body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome, small or large. Ones the project takes on are turned into issues and
        linked back here.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The thing you are trying to learn, write or find — not yet how the app should do it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Sketches and examples from other tools are welcome.
    validations:
      required: true
